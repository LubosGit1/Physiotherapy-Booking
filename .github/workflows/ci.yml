name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: ci-only-secret-never-used-in-production

jobs:
  checks:
    name: Lint, types, unit & component tests
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0 # types only, no browser needed here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/physio_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: physio_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: Cypress end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: physio_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: cp .env.e2e.example .env.e2e
      - uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm run e2e:serve
          wait-on: http://localhost:3100/api/health
          wait-on-timeout: 120
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
